name: Publiceer naar netwerk.klakkeloos.com

# Elke push naar main zet de site live. Er draait niets op de host zelf: deze actie
# logt in met FTPS en zet alleen de gewijzigde bestanden over.
on:
  push:
    branches: [main]
  # Met de hand starten kan ook, via het tabblad Actions op GitHub.
  workflow_dispatch:

jobs:
  publiceren:
    runs-on: ubuntu-latest
    steps:
      - name: Haal de site op
        uses: actions/checkout@v4

      - name: Zet over naar de webruimte
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          # De map van het subdomein, met een schuine streep aan het eind.
          # Bij DirectAdmin meestal iets als: domains/klakkeloos.com/public_html/netwerk/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # FTPS = gewone FTP met TLS eroverheen; dat kan bijna elke host.
          # Werkt dit niet, probeer dan "ftp" (onversleuteld, alleen als het moet).
          protocol: ftps
          # Wat er niet mee hoeft naar de server.
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            README.md
